name: Announce bot release (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.1.0'
        required: true
        type: string
jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send one Ukrainian announcement per version
        env:
          CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          version=os.environ['RELEASE_VERSION'].strip()
          if not version or len(version)>32 or not all(c.isdigit() or c=='.' for c in version):
              raise SystemExit('Invalid version')
          notes=('⚡ Світло Хмельниччини v'+version+'\n\n'
                 '✨ Що нового:\n'
                 '⏳ Орієнтовний відлік до ввімкнення світла.\n'
                 '📅 Розклад відключень на сьогодні та завтра.\n'
                 '🔔 Попередження перед плановим відключенням.\n'
                 '✉️ Зворотний зв’язок з автором.\n'
                 '🟢 Перевірка свіжості даних і стану бота.\n\n'
                 'Дякуємо, що користуєтеся ботом! 💙💛')
          body=json.dumps({'version':version,'notes':notes},ensure_ascii=False).encode()
          req=urllib.request.Request('https://svitlo-khmel-bot.vercel.app/api/release-notify',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['CHECK_SECRET'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=120) as response:
              print(response.read().decode())
          PY
