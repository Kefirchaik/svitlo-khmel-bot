name: Update official GPV schedules
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Fetch official schedules and cache
        env:
          CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
        run: node scripts/update-gpv.mjs
