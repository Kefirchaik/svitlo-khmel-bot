name: Planned outage reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Notify users before planned outages
        env:
          CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
        run: |
          curl --fail-with-body --retry 2 --max-time 120 \
            -H "Authorization: Bearer $CHECK_SECRET" \
            "https://svitlo-khmel-bot.vercel.app/api/reminders"
